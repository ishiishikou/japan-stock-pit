name: Discover e-Stat Macro Tables

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * 0"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/discover-estat.yml"
      - "collectors/estat_catalog.py"
      - "config/estat_search_terms.json"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile collectors/estat_catalog.py

      - name: e-Stat app ID not configured
        if: env.ESTAT_APP_ID == ''
        run: echo "::notice::ESTAT_APP_ID is not configured; discovery is skipped."

      - name: Install dependencies
        if: env.ESTAT_APP_ID != ''
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Discover macro tables
        if: env.ESTAT_APP_ID != ''
        run: python collectors/estat_catalog.py
