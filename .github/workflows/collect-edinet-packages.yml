name: Collect EDINET XBRL CSV PIT

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "JST calendar days to scan"
        required: false
        default: "7"
      max_new_documents:
        description: "Maximum new EDINET packages to download"
        required: false
        default: "150"
  schedule:
    # 12:20 and 19:20 JST. Repeated lookback + per-doc manifests make runs idempotent.
    - cron: "20 3,10 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-edinet-packages.yml"
      - "collectors/edinet_packages.py"
      - "config/edinet_document_types.json"

concurrency:
  group: b2-read-heavy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      EDINET_PACKAGE_LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
      EDINET_MAX_NEW_DOCUMENTS: ${{ inputs.max_new_documents || '150' }}
      EDINET_REQUEST_INTERVAL_SECONDS: "1.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile collectors/edinet_packages.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect selected EDINET XBRL CSV packages
        run: |
          python collectors/edinet_packages.py \
            --lookback-days "$EDINET_PACKAGE_LOOKBACK_DAYS" \
            --max-new-documents "$EDINET_MAX_NEW_DOCUMENTS"
