name: Normalize EDINET Financial Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-edinet-financial.yml"
      - "processors/edinet_financial.py"
      - "config/financial_metric_elements.json"

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile processors/edinet_financial.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Normalize financial facts
        run: python processors/edinet_financial.py
