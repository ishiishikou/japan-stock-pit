name: Discover EDINET Financial Aliases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/discover-edinet-financial-aliases.yml"
      - "scripts/discover_edinet_financial_aliases.py"

concurrency:
  group: b2-read-heavy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/discover_edinet_financial_aliases.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Discover unmatched aliases
        run: python scripts/discover_edinet_financial_aliases.py
