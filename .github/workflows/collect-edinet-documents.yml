# Trigger note: initial EDINET production run after secret registration.
name: Collect EDINET Document List PIT

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "JST calendar days to collect, including today"
        required: false
        default: "3"
  schedule:
    # Daily 23:30 JST (14:30 UTC). The collector also revisits recent dates.
    - cron: "30 14 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-edinet-documents.yml"
      - "collectors/edinet_documents.py"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      EDINET_LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile collectors/edinet_documents.py

      - name: Check EDINET API key
        if: env.EDINET_API_KEY == ''
        run: echo "::notice::EDINET_API_KEY is not configured; collection is skipped."

      - name: Install dependencies
        if: env.EDINET_API_KEY != ''
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect EDINET document-list PIT data
        if: env.EDINET_API_KEY != ''
        run: python collectors/edinet_documents.py --lookback-days "$EDINET_LOOKBACK_DAYS"
