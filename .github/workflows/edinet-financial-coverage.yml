name: EDINET Financial Metric Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/edinet-financial-coverage.yml"
      - "scripts/edinet_financial_coverage.py"

concurrency:
  group: b2-read-heavy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/edinet_financial_coverage.py
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python scripts/edinet_financial_coverage.py
