name: Collect J-Quants Free PIT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-jquants-free.yml"
      - "collectors/jquants_free.py"
      - "features/jquants_forecast.py"
      - "features/contracts.py"
      - "analysis/universe.py"
      - "processors/identifiers.py"
      - "requirements-jquants.txt"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile collectors/jquants_free.py
          python -m py_compile features/jquants_forecast.py
          python -m py_compile analysis/universe.py
          python -m py_compile processors/identifiers.py

      - name: J-Quants key not configured
        if: env.JQUANTS_API_KEY == ''
        run: echo "::notice::JQUANTS_API_KEY is not configured; collection is skipped."

      - name: Install dependencies
        if: env.JQUANTS_API_KEY != ''
        run: python -m pip install --upgrade pip && pip install -r requirements-jquants.txt

      - name: Collect J-Quants Free data
        if: env.JQUANTS_API_KEY != ''
        run: python collectors/jquants_free.py
