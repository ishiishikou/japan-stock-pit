name: Report B2 Storage Usage

on:
  workflow_dispatch:
  schedule:
    - cron: "5 15 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/report-b2-storage.yml"
      - "scripts/b2_storage_report.py"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: python -m pip install --upgrade pip && pip install "boto3>=1.35,<2"

      - name: Report B2 storage usage
        run: python scripts/b2_storage_report.py
