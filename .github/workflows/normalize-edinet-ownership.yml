name: Normalize EDINET Ownership PIT

on:
  workflow_dispatch:
  schedule:
    # 20:30 JST, after the evening EDINET package collection.
    - cron: "30 11 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-edinet-ownership.yml"
      - "processors/edinet_ownership.py"

concurrency:
  group: b2-ownership
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile processors/edinet_ownership.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Normalize large-shareholding filings
        run: python processors/edinet_ownership.py
