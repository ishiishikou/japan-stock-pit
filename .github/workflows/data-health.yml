name: PIT Data Health Report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/data-health.yml"
      - "scripts/data_health_report.py"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install "boto3>=1.35,<2"
      - run: python scripts/data_health_report.py
