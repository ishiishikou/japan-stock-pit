name: Collect BOJ Macro PIT

on:
  workflow_dispatch:
  schedule:
    # Weekdays 18:15 JST (09:15 UTC), after most BOJ daytime updates.
    - cron: "15 9 * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-boj-macro.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect BOJ macro PIT data
        run: python collectors/boj_timeseries.py
