name: Backfill EDINET Historical PIT

on:
  workflow_dispatch:
  schedule:
    # Twice daily, away from the current-data package collection windows.
    - cron: "10 5,17 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-edinet.yml"
      - "collectors/edinet_backfill.py"

concurrency:
  group: b2-read-heavy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      EDINET_BACKFILL_DAYS_PER_RUN: "14"
      EDINET_BACKFILL_MAX_NEW_DOCUMENTS: "75"
      EDINET_REQUEST_INTERVAL_SECONDS: "1.5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile collectors/edinet_packages.py
          python -m py_compile collectors/edinet_backfill.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Backfill historical EDINET packages
        run: python collectors/edinet_backfill.py
